name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test public-readiness scanner
        shell: pwsh
        run: ./tools/public-readiness/tests/Test-PublicReadiness.Tests.ps1

      - name: Check public readiness
        shell: pwsh
        run: ./tools/public-readiness/Test-PublicReadiness.ps1

      - name: Test regression audit
        shell: pwsh
        run: ./tools/regression-audit/tests/Invoke-RegressionAudit.Tests.ps1

      - name: Audit reproducible source state
        shell: pwsh
        run: ./tools/regression-audit/Invoke-V25-90-RegressionAudit.ps1 -NoReport

  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.302'

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore ./application/Descartes.CertaintyLab/Descartes.CertaintyLab.csproj --locked-mode
          dotnet restore ./tests/SingleAppWiring.Tests.csproj --locked-mode

      - name: Build Release projects
        shell: pwsh
        run: |
          dotnet build ./application/Descartes.CertaintyLab/Descartes.CertaintyLab.csproj -c Release --no-restore
          dotnet build ./tests/SingleAppWiring.Tests.csproj -c Release --no-restore

      - name: Run wiring harness
        shell: pwsh
        run: dotnet run --project ./tests/SingleAppWiring.Tests.csproj -c Release --no-build
